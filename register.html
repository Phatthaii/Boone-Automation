<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิกร้านค้า - ServiceBook</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=1" />
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- DEBUG: Show errors on screen -->
    <script>
        window.onerror = function (msg, url, line, col, error) {
            const div = document.createElement('div');
            div.style.cssText = 'position:fixed; top:0; left:0; right:0; background:red; color:white; padding:20px; z-index:9999; font-size:12px; overflow:scroll; max-height:50vh;';
            div.innerText = 'Error: ' + msg + '\nLine: ' + line + '\nURL: ' + url;
            document.body.appendChild(div);
            // Hide loading if error
            const loader = document.getElementById("loadingMessage");
            if (loader) loader.style.display = 'none';
        };
    </script>
</head>

<body>

    <div class="background-overlay"></div>
    <div class="container">
        <header>
            <div class="logo-area">
                <i class="fas fa-store fa-3x"></i>
            </div>
            <h1>เปิดร้านค้าใหม่ <span style="font-size:12px; color:#ccc;">(v1.1)</span></h1>
            <p>ระบบจองคิวออนไลน์สำหรับธุรกิจของคุณ</p>
        </header>

        <form id="registerForm">
            <!-- Hidden Fields -->
            <input type="hidden" id="ownerLineId" />
            <input type="hidden" id="ownerDisplayName" />

            <div class="form-group">
                <label><i class="fas fa-store-alt"></i> ชื่อร้านค้าของคุณ</label>
                <input type="text" id="shopName" placeholder="เช่น คลินิกหมอสมชาย, ร้านเสริมสวยเจนนี่" required />
            </div>

            <div class="form-group">
                <label><i class="fas fa-briefcase"></i> ประเภทธุรกิจ</label>
                <select id="businessType" required>
                    <option value="" disabled selected>-- เลือกประเภท --</option>
                    <option value="carwash">🚗 ร้านล้างรถ (Car Wash)</option>
                    <option value="clinic">🏥 คลินิก (Clinic)</option>
                    <option value="salon">💇‍♀️ ร้านเสริมสวย/ทำผม (Salon)</option>
                </select>
            </div>

            <div id="loadingMessage" style="text-align:center; color:#666; display:none;">
                <i class="fas fa-spinner fa-spin"></i> กำลังตรวจสอบข้อมูล LINE...
            </div>

            <button type="submit" id="submitBtn" disabled>ลงทะเบียนเปิดร้าน (Login w/ LINE)</button>
        </form>

        <div id="statusMessage"></div>
    </div>

    <script>
        // --- Configuration ---
        const SUPABASE_URL = "https://vprtarhfpjcgshciadca.supabase.co";
        const SUPABASE_KEY = "sb_publishable__s23ahvDwKLlv78MF-xBDA_MyI02PYq";
        const LIFF_ID = "2008806162-K39SJq6X"; // Use a LIFF ID that allows this URL

        // Define client with a different name to avoid conflict with global 'supabase'
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function main() {
            try {
                const btn = document.getElementById("submitBtn");
                const loader = document.getElementById("loadingMessage");
                const registerForm = document.getElementById("registerForm");

                // Initially hide form
                registerForm.style.display = 'none';
                loader.style.display = "block";

                await liff.init({ liffId: LIFF_ID });

                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    const profile = await liff.getProfile();
                    const userId = profile.userId;

                    document.getElementById("ownerLineId").value = userId;
                    document.getElementById("ownerDisplayName").value = profile.displayName;

                    // CHECK IF OWNER ALREADY EXISTS
                    const { data: existingShop, error } = await supabaseClient
                        .from('shops')
                        .select('id')
                        .eq('owner_line_id', userId)
                        .maybeSingle();

                    if (existingShop) {
                        // User already has a shop -> Redirect to Admin
                        loader.innerHTML = '<i class="fas fa-check-circle"></i> พบร้านค้าของคุณ!<br>กำลังเข้าสู่ระบบหลังบ้าน...';
                        setTimeout(() => {
                            window.location.href = "admin.html";
                        }, 1500);
                        return;
                    }

                    // No shop found -> Show Register Form
                    loader.style.display = "none";
                    registerForm.style.display = 'block';
                    btn.style.display = "block";
                    btn.disabled = false;
                    btn.innerText = "ยืนยันการเปิดร้าน";
                }
            } catch (err) {
                console.error("LIFF Init failed", err);
                const errorDiv = document.createElement('div');
                errorDiv.style.cssText = 'position:fixed; top:20%; left:10%; right:10%; background:white; color:red; padding:20px; text-align:center; border:2px solid red; z-index:9999; border-radius:10px; box-shadow:0 10px 20px rgba(0,0,0,0.2);';
                errorDiv.innerHTML = '<h3>LIFF Error</h3><p>' + (err.message || err) + '</p><p style="font-size:12px; color:#666;">' + (err.code || '') + '</p>';
                document.body.appendChild(errorDiv);
            }
        }

        main();

        document.getElementById("registerForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const name = document.getElementById("shopName").value;
            const type = document.getElementById("businessType").value;
            const lineId = document.getElementById("ownerLineId").value;

            if (!lineId) return alert("ไม่พบข้อมูล LINE กรุณารีเฟรช");

            const btn = document.getElementById("submitBtn");
            btn.disabled = true;
            btn.innerText = "กำลังสร้างร้านค้า...";

            // Insert into Shops
            const { data, error } = await supabaseClient
                .from('shops')
                .insert([
                    {
                        name: name,
                        business_type: type,
                        owner_line_id: lineId,
                        status: 'trial'
                    }
                ])
                .select();

            if (error) {
                console.error(error);
                alert("เกิดข้อผิดพลาด: " + error.message);
                btn.disabled = false;
                btn.innerText = "ยืนยันการเปิดร้าน";
            } else {
                const origin = window.location.origin;
                const path = window.location.pathname.replace('register.html', 'index.html');
                const bookingLink = `${origin}${path}?shop_id=${shopId}`;

                // Success! Redirect to dashboard or show link
                document.querySelector('.container').innerHTML = `
                    <div style="text-align:center;">
                        <i class="fas fa-check-circle fa-4x" style="color:#2ecc71; margin-bottom:20px;"></i>
                        <h2>เปิดร้านสำเร็จ!</h2>
                        <p>ลูกค้าสามารถจองได้ที่ลิงก์นี้:</p>
                        <div style="background:#f1f5f9; padding:15px; border-radius:8px; margin:15px 0; word-break:break-all; font-family:monospace; color:#004aad; border:1px dashed #004aad;">
                            ${bookingLink}
                        </div>
                        <p style="font-size:14px; color:#666;">แนะนำ: นำลิงก์นี้ไปใส่ใน Rich Menu หรือข้อความทักทายเพื่อนใหม่ใน LINE OA ของร้านคุณ</p>
                        <br>
                        <a href="${bookingLink}" class="btn" style="text-decoration:none; display:inline-block; margin-top:10px;">ทดลองจอง (เปิดหน้าจอง)</a>
                    </div>
                `;
            }
        });
    </script>
</body>

</html>
